spring.datasource.url=jdbc:h2:mem:currencydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jackson.deserialization.use-big-decimal-for-floats=true
coindesk.url=https://kengp3.github.io/blog/coindesk.json
coindesk.connect-timeout-ms=5000
coindesk.read-timeout-ms=10000
