# Each Spring test context gets its own in-memory database.
# Hikari closes its connections when the context is destroyed, deleting the database.
spring.datasource.url=jdbc:h2:mem:currency-test-${random.uuid};DB_CLOSE_DELAY=0;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
